name: Refresh Google Ads data

# Aim: fresh figures live by 6am NZ. GitHub often starts scheduled runs late, so this runs
# hourly from 1:07am to 5:07am NZ daylight time (12:07 to 16:07 UTC). Each run refetches the
# whole campaign to yesterday (NZ time), so later runs pick up late-attributed bookings.
# Can also be run by hand: Actions tab -> Refresh Google Ads data -> Run workflow.
on:
  schedule:
    - cron: "7 12-16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-report
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Pull Google Ads data (read-only)
        env:
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
        run: python scripts/fetch_google.py .
      - name: Commit if changed (push republishes Pages)
        run: |
          git add data/
          if git diff --cached --quiet -- data/; then echo "No data changes."; exit 0; fi
          git config user.name "explore-report-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Daily data refresh $(TZ=Pacific/Auckland date +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main
